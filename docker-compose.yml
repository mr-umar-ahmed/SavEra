# SAVERA — PostgreSQL 15 + TimescaleDB 2.28 and the FastAPI backend.
# Frontend runs with `npm run dev` in ./frontend (see README).
services:
  db:
    image: timescale/timescaledb:2.28.3-pg15
    container_name: savera-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: savera
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5432:5432"
    volumes:
      - savera_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d savera"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    container_name: savera-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/savera
      UPLOAD_DIR: /data/uploads
    ports:
      - "8000:8000"
    volumes:
      - savera_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  savera_pgdata:
  savera_uploads:
